<!doctype html><html><head><meta charset=utf8><base href="/"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Relay team agent</title>
<link rel="stylesheet" href="fonts/pretendard.css">
<link rel="stylesheet" href="styles.css">
<div class="orbs" aria-hidden="true"><span class="orb b"></span><span class="orb v"></span><span class="orb c"></span><span class="orb p"></span></div>
<div class="app">
  <header class="top">
    <button class="brand" data-home><span class="brand-mark" aria-hidden="true"></span>Relay</button>
    <span class="top-sep work-only" aria-hidden="true"></span>
    <div class="doc-name work-only"><strong id="docTitle"></strong></div>
    <div class="top-right">
      <div class="seg lang home-only" id="langSeg"><button class="tab" data-lang="en">EN</button><button class="tab" data-lang="ko">한국어</button></div>
      <div class="presence work-only" id="presence" aria-label="Team"></div>
      <div class="agent-chip work-only" id="agentChip" data-status="idle"><span class="av agent"><img src="img/agent-basic.png" alt=""></span><span class="dot" aria-hidden="true"></span><span id="agentText"></span></div>
      <button type="button" class="btn ghost work-only" data-copy-link hidden></button>
    </div>
  </header>

  <section class="home" id="home" aria-label="Library"></section>

  <div class="main" hidden>
    <section class="left" aria-label="Shared document">
      <div class="tabs">
        <div class="seg" role="tablist">
          <button class="tab" role="tab" id="tabDoc" aria-selected="true" aria-controls="docPane">Document <span class="count" id="docCount">0</span></button>
          <button class="tab" role="tab" id="tabDisc" aria-selected="false" aria-controls="discPane">Discussions <span class="count" id="discCount">0</span></button>
          <button class="tab" role="tab" id="tabLog" aria-selected="false" aria-controls="logPane">Activity <span class="count" id="logCount">0</span></button>
        </div>
        <span class="tabs-hint" id="tabsHint"></span>
      </div>
      <div class="pane-scroll" id="leftScroll">
        <div id="docPane" role="tabpanel" aria-labelledby="tabDoc"></div>
        <div id="discPane" role="tabpanel" aria-labelledby="tabDisc" hidden></div>
        <div id="logPane" role="tabpanel" aria-labelledby="tabLog" hidden></div>
      </div>
      <div class="viewer" id="viewer"></div>
    </section>

    <aside class="right" aria-label="Session">
      <div class="rail" id="rail" hidden></div>
      <div class="chat-h" id="chatHead"></div>
      <div class="msgs" id="msgs" aria-live="polite"></div>
      <div class="readonly" id="readonly" hidden></div>
      <form class="composer" id="composer">
        <div id="ctx"></div>
        <div class="chips" id="chips"></div>
        <div class="box">
          <button type="button" class="lockbtn" id="lockBtn"></button>
          <textarea id="input" rows="1" placeholder="Message the agent…" aria-label="Message to the agent"></textarea>
          <button class="send" type="submit" aria-label="Send"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg></button>
        </div>
      </form>
    </aside>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<div id="modalRoot"></div>
<script>
  (function () {
    var q = new URL(location.href).searchParams.get('lang');
    var saved = null; try { saved = localStorage.getItem('relay.lang'); } catch (e) {}
    window.RELAY_LANG = (q || saved) === 'ko' ? 'ko' : 'en';
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/api/config"></script>
<script src="i18n.js"></script>
<script src="data.js"></script>
<script src="diff.js"></script>
<script src="store.js"></script>
<script src="export.js"></script>
<script src="panels.js"></script>
<script src="app.js"></script>

</body></html>
